name: Consilium static checks
on:
  pull_request:
  push:
    branches: [main, "feat/**"]
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run syntax and safety checks
        run: node scripts/check.mjs
